server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/devforge_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Shekhar@34
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Session config for OAuth2 state persistence ───────────────────────────
  session:
    store-type: none   # in-memory session is fine for local dev

  servlet:
    session:
      cookie:
        same-site: lax       # lax allows the cookie to survive Google redirect
        http-only: true
        secure: false        # false for localhost (no HTTPS)

  # ── Google OAuth2 ──────────────────────────────────────────────────────────
  # Replace REPLACE_ME values with real credentials from Google Cloud Console:
  #   https://console.cloud.google.com → APIs & Services → Credentials
  # Authorized redirect URI to add: http://localhost:8080/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: REPLACE_ME_GOOGLE_CLIENT_ID
            client-secret: REPLACE_ME_GOOGLE_CLIENT_SECRET
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: devforge-secret-key-devforge-secret-key-123456789
  expiration: 86400000

# ── OAuth2 redirect URIs ───────────────────────────────────────────────────
app:
  oauth2:
    redirect-uri: http://localhost:5173/oauth2/redirect
    failure-uri:  http://localhost:5173/oauth2/error

# ─────────────────────────────────────────────────────────────
# OpenRouter AI Configuration
# Replace the placeholder keys with your real OpenRouter keys.
# Add as many keys as needed — round-robin rotation is automatic.
# ─────────────────────────────────────────────────────────────
openrouter:
  base-url: https://openrouter.ai/api/v1/chat/completions
  timeout-seconds: 60
  max-retries: 3
  memory-size: 20          # last N messages injected into every prompt
  keys:
    - REPLACE_ME_OPENROUTER_KEY_1
    - REPLACE_ME_OPENROUTER_KEY_2
    - REPLACE_ME_OPENROUTER_KEY_3

  # Model routing — change model names here without touching any Java code
  models:
    architecture:  "deepseek/deepseek-r1"
    backend:       "openai/gpt-4.1"
    frontend:      "openai/gpt-4.1"
    debug:         "anthropic/claude-sonnet-4-5"
    documentation: "google/gemini-2.5-pro"
    database:      "deepseek/deepseek-r1"
    security:      "anthropic/claude-sonnet-4-5"
    planning:      "deepseek/deepseek-r1"
    general:       "openai/gpt-4.1"

---
spring:
  config:
    activate:
      on-profile: prod
  servlet:
    session:
      cookie:
        secure: true
server:
  port: 8080
